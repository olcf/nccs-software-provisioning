argument_specs:
  main:
    description:
      - Installs LLVM and optionally generates a module file.
    options:
      NSP_LLVM_version:
        type: str
        required: true
        description: The version to install.
      NSP_LLVM_projects:
        type: list
        elements: str
        required: false
        default:
          - clang
          - lld
          - compiler-rt
        description: LLVM projects to build.
      NSP_LLVM_runtimes:
        type: list
        elements: str
        required: false
        default:
          - libcxx
          - libcxxabi
          - libunwind
          - openmp
        description: Library runtimes to build.
      NSP_LLVM_create_module:
        type: bool
        required: false
        default: true
        description: Toggles module generation.
      NSP_LLVM_clear_source:
        type: bool
        required: false
        default: true
        description: Clear source files from previous build.
      NSP_LLVM_use_binutils:
        type: bool
        required: false
        default: false
        description: Install and use Binutils when building LLVM.
      NSP_LLVM_binutils_version:
        type: str
        required: false
        default: "2.47"
        description: The Binutils version to install and use when NSP_LLVM_use_binutils is enabled.
