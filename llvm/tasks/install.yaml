- name: Clear Previous LLVM v{{ NSP_LLVM_version }} Build Files
  ansible.builtin.file:
    path: "{{ [NSP_scratch_directory, 'llvm-project-llvmorg-{}'.format(NSP_LLVM_version)] | path_join }}"
    state: absent
  when: NSP_LLVM_clear_source
  tags:
    - llvm

- name: Check for LLVM v{{ NSP_LLVM_version }} Source Files
  ansible.builtin.stat:
    path: "{{ [NSP_scratch_directory, 'llvm-project-llvmorg-{}'.format(NSP_LLVM_version)] | path_join }}"
  register: llvm_source_status
  tags:
    - llvm

- name: Download and Unpack LLVM v{{ NSP_LLVM_version }} Tarball
  ansible.builtin.unarchive:
    remote_src: true
    src: "https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-{{ NSP_LLVM_version }}.tar.gz"
    dest: "{{ NSP_scratch_directory }}"
  when: not llvm_source_status.stat.exists
  tags:
    - llvm

- name: Install Binutils for LLVM v{{ NSP_LLVM_version }}
  ansible.builtin.include_role:
    name: binutils
    apply:
      tags:
        - llvm
  vars:
    NSP_BINUTILS_version: "{{ NSP_LLVM_binutils_version }}"
    NSP_BINUTILS_install_root: "{{ [NSP_LLVM_install_root, 'binutils'] | path_join }}"
    NSP_BINUTILS_create_module: false
    NSP_keep_scratch_clear: false
  when: NSP_LLVM_use_binutils
  tags:
    - llvm

- name: Install GCC for LLVM v{{ NSP_LLVM_version }}
  ansible.builtin.include_role:
    name: gcc
    apply:
      tags:
        - llvm
  vars:
    NSP_GCC_version: "{{ NSP_LLVM_gcc_version }}"
    NSP_GCC_install_root: "{{ [NSP_LLVM_install_root, 'gcc'] | path_join }}"
    NSP_GCC_create_module: false
    NSP_keep_scratch_clear: false
  when: NSP_LLVM_use_gcc
  tags:
    - llvm

- name: Build and Install LLVM v{{ NSP_LLVM_version }}
  ansible.builtin.shell:
    cmd: |
      set -e
      rm -rf build && mkdir build
      {% if NSP_LLVM_use_binutils %}
      BINUTILS_BIN="{{ [NSP_LLVM_install_root, 'binutils/bin'] | path_join }}"
      {% endif %}
      {% if NSP_LLVM_use_gcc %}
      GCC_ROOT="{{ [NSP_LLVM_install_root, 'gcc'] | path_join }}"
      export LD_LIBRARY_PATH="${GCC_ROOT}/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
      {% endif %}
      cmake \
      -S llvm \
      -B build \
      {% if NSP_LLVM_use_gcc %}
      -DCMAKE_C_COMPILER="${GCC_ROOT}/bin/gcc" \
      -DCMAKE_CXX_COMPILER="${GCC_ROOT}/bin/g++" \
      -DCMAKE_ASM_COMPILER="${GCC_ROOT}/bin/gcc" \
      -DCMAKE_INSTALL_RPATH="${GCC_ROOT}/lib64" \
      {% else %}
      -DCMAKE_C_COMPILER=/usr/bin/gcc \
      -DCMAKE_CXX_COMPILER=/usr/bin/g++ \
      -DCMAKE_ASM_COMPILER=/usr/bin/gcc \
      {% endif %}
      -DCMAKE_INSTALL_PREFIX={{ [NSP_LLVM_install_root] | path_join }} \
      {% if NSP_LLVM_use_binutils %}
      -DCMAKE_ASM_FLAGS="-B${BINUTILS_BIN}/" \
      -DCMAKE_LINKER="${BINUTILS_BIN}/ld" \
      -DCMAKE_C_FLAGS="-B${BINUTILS_BIN}/" \
      -DCMAKE_CXX_FLAGS="-B${BINUTILS_BIN}/" \
      {% endif %}
      -DCMAKE_BUILD_TYPE=Release \
      -DLLVM_TARGETS_TO_BUILD='{{ ';'.join(NSP_LLVM_targets) }}' \
      -DLLVM_ENABLE_PROJECTS='{{ ';'.join(NSP_LLVM_projects) }}' \
      -DLLVM_ENABLE_RUNTIMES='{{ ';'.join(NSP_LLVM_runtimes) }}'
      cmake --build build -j{{ NSP_max_threads }}
      cmake --build build --target install
    chdir: "{{ [NSP_scratch_directory, 'llvm-project-llvmorg-{}'.format(NSP_LLVM_version)] | path_join }}"
  changed_when: true
  tags:
    - llvm

- name: Clean Up Scratch After LLVM v{{ NSP_LLVM_version }} Build
  ansible.builtin.include_role:
    name: nsp
    tasks_from: clear_scratch
  when: NSP_keep_scratch_clear
  tags:
    - llvm
