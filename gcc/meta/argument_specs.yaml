argument_specs:
  main:
    description:
      - Installs GCC from source.
    options:
      NSP_GCC_version:
        type: str
        required: true
        description: The version to install.
      NSP_GCC_enabled_languages:
        type: list
        elements: str
        required: false
        default:
          - c
          - c++
          - fortran
        description: The languages that the build will support.
      NSP_GCC_clean_build:
        type: bool
        required: false
        default: true
        description: Remove previous build source files.
      NSP_GCC_create_module:
        type: bool
        required: false
        default: true
        description: Toggles module generation.
      NSP_GCC_use_binutils:
        type: bool
        required: false
        default: false
        description: Install and use Binutils when building GCC.
      NSP_GCC_binutils_version:
        type: str
        required: false
        default: "2.47"
        description: The Binutils version to install and use when NSP_GCC_use_binutils is enabled.
